<meta charset="utf-8">

<title>Schedule to Form 1</title>

<style>
  body { font-family: "Times New Roman", "PMingLiU", "PMingLiu", serif; margin: 24px; color: #222; max-width: 980px; }
  h1 { font-size: 22px; text-align: center; }
  h2 { font-size: 16px; margin-top: 28px; }
  #drop { border: 2px dashed #1F4E79; border-radius: 10px; padding: 28px; text-align: center; color: #1F4E79; background: #f4f8fb; cursor: pointer; margin-bottom: 16px; }
  #drop.over { background: #e3eef8; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: 13px; }
  th, td { border: 1px solid #999; padding: 4px 6px; }
  th { background: #1F4E79; color: #fff; }
  .sci { font-style: italic; }
  .note { color: #555; font-size: 13px; font-family: Arial, sans-serif; }
  .opts { font-family: Arial, sans-serif; margin: 8px 0 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .opts label { font-size: 14px; }
  .opts input[type="text"] { font-family: inherit; font-size: 14px; padding: 4px 8px; min-width: 280px; }
  .opts button { font-family: inherit; font-size: 14px; padding: 6px 12px; cursor: pointer; }
  h3 { font-size: 15px; margin-top: 22px; }
  #report { font-family: "Times New Roman", "PMingLiU", serif; }
  #report table { width: auto; min-width: 70%; font-size: 12pt; }
  #report th, #report td { border: 1px solid #000; padding: 4px 8px; }
  #report th { background: #fff; color: #000; font-weight: bold; text-align: center; }
  .warn { background: #fff6e5; border: 1px solid #c47b00; color: #5c3a00; padding: 12px 14px; margin: 0 0 18px; border-radius: 8px; font-family: Arial, sans-serif; font-size: 14px; }
  .warn h3 { margin: 0 0 8px; font-size: 15px; color: #8a4b00; }
  .warn table th { background: #c47b00; }
  @media print { #drop, .opts, .note, .noprint, .warn { display: none; } }
</style>
</head>
<body>
<div id="drop">把 Tree Assessment Schedule（.xlsx / .xls）拖到這裡，或點擊選擇檔案</div>
<input type="file" id="file" accept=".xlsx,.xls" hidden>
<div class="opts">
  <label>工程名稱 <input type="text" id="project" placeholder="可留空；會嘗試由表頭自動讀取"></label>
  <label>額外 Tree Groups（冇樹都要列入） <input type="text" id="extraGroups" placeholder="例如：TG769"></label>
  <label><input type="radio" name="dead" value="Unidentified" checked> Dead tree → Unidentified</label>
  <label><input type="radio" name="dead" value="Dead tree"> Dead tree → Dead tree</label>
  <label><input type="radio" name="mode" value="construction" checked> Construction（3.3 及 Section 4）</label>
  <label><input type="radio" name="mode" value="private"> Private（不出 Section 4）</label>
</div>
<p class="note">檔案只在你的瀏覽器處理，不會上載到伺服器。Remarks 會對照內建缺陷表；學名及中文名會對照發展局 203 種市區常見樹木清單，並提示大小寫及寫法差異（不會自動改名）。亦會檢查品種是否列於第96章《林務規例》（第96A章）或第586章保護名單。匯出 Excel 的 Sheet1、Sheet2 可直接由 A1 複製到 Form 1 的同名工作表。</p>
<div id="out"></div>
<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
let lastFile = null;
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) run(e.dataTransfer.files[0]); };
fileInput.onchange = () => { if (fileInput.files[0]) run(fileInput.files[0]); };
document.querySelectorAll('input[name=dead], input[name=mode]').forEach(el => {
  el.addEventListener('change', () => { if (lastFile) run(lastFile); });
});
['project','extraGroups'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { if (lastFile) run(lastFile); });
});

const s = v => String(v ?? '').replace(/[\u00a0\u200b\u200c\u200d\ufeff\u3000]/g, ' ').replace(/\s+/g, ' ').trim();
const esc = v => s(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const looks = v => {
  const t = s(v).replace(/\s+/g,'');
  if (!t || /^(nan|none|n\.?a\.?|-|item|sn|no|treeno|treenumber|treeid)$/i.test(t)) return false;
  if (/^\d{4}-\d{2}-\d{2}/.test(t)) return false;
  if (!/\d/.test(t) || t.length > 32) return false;
  return /^[A-Za-z0-9][A-Za-z0-9\-_.\/]*[A-Za-z0-9]$/.test(t) || /^\d+[A-Za-z]?$/.test(t);
};
const isRemoved = r => s(r).split(/[,;，、]/).map(x => x.trim()).some(p => /^removed\.?$/i.test(p));
const isDeadSpecies = (sci, chi) => /dead\s*trees?|^dead$|unidentified|死樹|枯樹/i.test((s(sci) + ' ' + s(chi)).trim());
const remarkIsDeadTree = rem => {
  const t = s(rem);
  return /dead\s*trees?|死樹|枯樹/i.test(t) || /^dead\.?$/i.test(t);
};

function sciMatchesProtected(sci, taxon) {
  if (isBlankName(sci)) return false;
  const p = parseSci(sci);
  const genus = (p.parts[0] || '').toLowerCase();
  if (!genus) return false;
  if (taxon.level === 'family') {
    const fam = (taxon.family || '').toLowerCase();
    if (genus === fam) return true;
    return (taxon.genera || []).some(g => g === genus);
  }
  if (taxon.level === 'genus') {
    return genus === (taxon.genus || '').toLowerCase();
  }
  const listed = [taxon.sci].concat(taxon.sciAliases || []);
  return listed.some(name => {
    const b = parseSci(name);
    if (!p.core || !b.core) return false;
    if (p.core === b.core) return true;
    return !!(p.binomial && b.binomial && p.binomial === b.binomial);
  });
}
function chiMatchesProtected(chi, taxon) {
  if (isBlankName(chi)) return false;
  const key = typoChi(chi);
  if (!key) return false;
  return (taxon.chi || []).some(alias => typoChi(alias) === key);
}

function detectProject(raw, hr) {
  const skip = /tree assessment schedule|initial tree survey|tree inventory|^nan$/i;
  let best = '';
  for (let i = 0; i < hr; i++) {
    for (const cell of (raw[i] || [])) {
      const t = s(cell).replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (t.length > best.length && t.length > 20 && !skip.test(t)) best = t;
    }
  }
  return best;
}

function findHeader(raw) {
  for (let i = 0; i < Math.min(raw.length, 25); i++) {
    const j = raw[i].map(x => String(x).toLowerCase().replace(/\n/g,' ')).join(' ');
    const first = s(raw[i][0]).toLowerCase();
    const hasId = j.includes('tree no') || j.includes('tree id') || j.includes('tree number') || j.includes('樹木編號') || j.includes('樹編號');
    const hasSp = j.includes('scientific') || j.includes('species') || j.includes('樹種') || j.includes('dbh') || j.includes('zone');
    if (hasId && hasSp && !j.includes('removed trees')) return i;
    if (first === 'trmz' && j.includes('zone') && hasId) return i;
  }
  return -1;
}

function run(file) {
  lastFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: 'array' });
    let raw = null, hr = 0, usedSheet = wb.SheetNames[0];
    for (const name of wb.SheetNames) {
      const tmp = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' });
      const found = findHeader(tmp);
      if (found >= 0) { raw = tmp; hr = found; usedSheet = name; break; }
    }
    if (!raw) {
      raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      hr = 0;
    }
    const hPrev = hr > 0 ? raw[hr-1].map(x => s(x).toLowerCase().replace(/\n/g,' ')) : [];
    const h1 = raw[hr].map(x => s(x).toLowerCase().replace(/\n/g,' '));
    const h2 = raw[hr+1] ? raw[hr+1].map(x => s(x).toLowerCase().replace(/\n/g,' ')) : [];
    const nCols = Math.max(hPrev.length, h1.length, h2.length);
    const combined = [];
    for (let i = 0; i < nCols; i++) {
      combined.push([hPrev[i]||'', h1[i]||'', h2[i]||''].filter(Boolean).join(' ').trim());
    }
    const find = (...kws) => combined.findIndex(t => kws.some(k => t.includes(k)));
    const findSkip = (kws, skips) => {
      const i = combined.findIndex(t => kws.some(k => t.includes(k)) && !skips.some(x => t.includes(x)));
      return i >= 0 ? i : find(...kws);
    };
    const c = {
      no: find('tree no','tree id','tree number','樹木編號','樹編號'),
      sci: find('scientific'),
      chi: find('chinese'),
      dbh: find('dbh'),
      ht: find('height'),
      sp: find('spread','crown'),
      health: find('health'),
      struct: find('structural','structure'),
      triage: find('triage'),
      rem: findSkip(['remark'], ['remarks*', 'suitability']),
      rec: find('mitigation','recommend','proposed'),
      zone: find('tree group') >= 0 ? find('tree group') : find('zone'),
      source: find('tprp/new','tprp','newly found','new found'),

    };
    const dataStart = h2.some(v => /scientific|chinese|dbh/.test(v)) ? hr+2 : hr+1;

      for (let col = 0; col < nCols; col++) {

        if (hits >= 5) { c.source = col; break; }
      }
    }

    const speciesRemarkDead = [];
    const mode = document.querySelector('input[name=mode]:checked').value;
    for (let i = dataStart; i < raw.length; i++) {
      const r = raw[i] || [];
      const no = s(r[c.no]).replace(/\s+/g,'');
      if (!looks(no)) continue;
      let sci = s(r[c.sci]), chi = s(r[c.chi]), remarks = s(r[c.rem]), rec = s(r[c.rec]);
      if (remarkIsDeadTree(remarks) && !isDeadSpecies(sci, chi)) {
        speciesRemarkDead.push({ no, sci, chi, remarks });
      }
      if (isDeadSpecies(sci, chi) || (!sci && !chi)) {
        if (deadAs === 'Unidentified') { sci = 'Unidentified'; chi = 'Unidentified'; }
        else { sci = 'Dead tree'; chi = '死樹'; }
      }
      trees.push({ no, sci, chi, dbh: s(r[c.dbh]), ht: s(r[c.ht]), spread: s(r[c.sp]),
        health: s(r[c.health]), struct: s(r[c.struct]), triage: s(r[c.triage]),
        remarks, rec, zone: s(r[c.zone]), source: s(r[c.source]),
        complete: c.complete >= 0 ? r[c.complete] : '', status: c.status >= 0 ? s(r[c.status]) : '' });
    }
    const remarkMismatches = collectRemarkMismatches(trees);
    const nameMismatches = collectNameMismatches(trees);
    const officialChecks = collectOfficialNameChecks(trees);
    const protectedChecks = collectProtectedSpeciesChecks(trees);
    const writingChecks = collectSciWritingChecks(trees);
    const dropped = /duplicate|not in use|out of lot|outside|boundary/i;
    const active = trees.filter(t => (mode === 'construction' || !isRemoved(t.remarks)) && !dropped.test(t.remarks + ' ' + t.rec));
    const species = {};
    active.forEach(t => {
      const k = t.sci + '|' + t.chi;
      if (!species[k]) species[k] = { n: 0, removed: 0 };
      species[k].n++;
      if (isRemoved(t.remarks)) species[k].removed++;
    });
    const spRows = Object.entries(species).map(([k,v]) => { const [sci,chi]=k.split('|'); return {sci,chi,n:v.n,removed:v.removed}; })
      .sort((a,b) => a.sci.toLowerCase().localeCompare(b.sci.toLowerCase()));
    const liveSpRows = Object.entries(species).filter(([k]) => { const [sci,chi]=k.split('|'); return !isDeadSpecies(sci, chi); });
    const dom = (liveSpRows.length ? liveSpRows : Object.entries(species)).sort((a,b)=>b[1].n-a[1].n)[0];
    const domSci = dom ? dom[0].split('|')[0] : 'N.A.';
    const domRest = dom ? `${dom[0].split('|')[1]} (${dom[1].n})`.trim() : '';
    const PRUNE = /crown cleaning|crown reduction|crown raising|crown thinning|pruning|selective|defective branch|dead (trunk|branch)|co-dominant|epicormic/i;
    const REM = /tree removal|\bfell(ing)?\b/i;
    const prune = active.filter(t => PRUNE.test(t.rec));
    const removal = active.filter(t => REM.test(t.rec));
    const monitor = active.filter(t => /keep monitoring|monitoring/i.test(t.rec));
    const pest = active.filter(t => /pest control|mistletoe/i.test(t.rec));
    const others = active.filter(t => t.rec && !/^(n\.?a\.?|-|)$/i.test(t.rec) && !PRUNE.test(t.rec) && !REM.test(t.rec) && !/keep monitoring|monitoring|pest control|mistletoe|re-inspection/i.test(t.rec));
    const otherGroups = [];
    {
      const map = {};
      others.forEach(t => {
        const k = s(t.rec);
        if (!map[k]) map[k] = [];
        map[k].push(t);
      });
      Object.keys(map).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase())).forEach(k => {
        otherGroups.push({label: k, n: map[k].length, nos: joinNos(map[k]), trees: map[k]});
      });
    }
    const pruneIds = [...new Set(prune.map(t => t.no))];
    const monitorIds = monitor.map(t => t.no);
    const pestIds = pest.map(t => t.no);
    const removalIds = removal.map(t => t.no);
    const reinspect = active.filter(t => /re-inspection/i.test(t.rec)).map(t => t.no);
    const triage = col => active.filter(t => new RegExp('^'+col+'$','i').test(t.triage));
    const y = triage('Yellow'), o = triage('Orange'), reds = triage('Red'), blk = triage('Black');
    const formA = active.filter(t => /yellow|orange|red|black/i.test(t.triage) || (t.rec && !/^(n\.?a\.?|-|no mitigation)/i.test(t.rec)));
    const formB = active.filter(t => !formA.includes(t));

    const allGroupSet = new Set();
    for (let i = dataStart; i < raw.length; i++) {
      const z = raw[i][c.zone];
      if (isTG(z)) allGroupSet.add(normTG(z));
    }
    parseExtraGroups(document.getElementById('extraGroups').value).forEach(g => allGroupSet.add(g));
    const byNum = (a,b) => (parseInt(a.replace(/\D/g,''))||0) - (parseInt(b.replace(/\D/g,''))||0);
    const groups = [...allGroupSet].sort(byNum);
    const groupsWithTrees = [...new Set(active.map(t => isTG(t.zone) ? normTG(t.zone) : '').filter(Boolean))].sort(byNum);
    const tprpN = active.filter(t => classifySource(t) === 'TPRP').length;
    const newN = active.filter(t => classifyKind(t) === 'NEW').length;
    const indN = active.filter(t => classifyKind(t) === 'INDIVIDUAL').length;
    const grpN = active.filter(t => classifyKind(t) === 'GROUP').length;
    const removedN = active.filter(t => isRemoved(t.remarks)).length;
    const deadN = active.filter(t => isDeadSpecies(t.sci, t.chi) && !isRemoved(t.remarks)).length;
    const aliveN = active.length - deadN - removedN;
    const speciesLive = spRows.filter(x => !isDeadSpecies(x.sci, x.chi));
    const speciesOrdered = speciesBreakdown(active);
    const joinAnd = arr => arr.length > 1 ? arr.slice(0,-1).join(', ') + ', and ' + arr[arr.length-1] : (arr[0] || 'the site');
    const groupList = joinAnd(groups);
    const withList = joinAnd(groupsWithTrees.length ? groupsWithTrees : groups);
    const groupIntro = groups.length
      ? `This tree survey was conducted within ${groups.length} existing Tree Groups, of which ${groupsWithTrees.length} were found to contain trees. The surveyed Tree Groups are ${groupList}. The trees covered in this submission are located within existing planting areas in ${withList}, all of which fall within the site boundary.`
      : '';
    const project = s(document.getElementById('project').value) || detectProject(raw, hr);
    const projectPhrase = project ? ' at ' + project : '';
    const section33Intro = `A total of ${speciesLive.length} species were recorded during the survey and are represented throughout the survey area. No rare tree species, Registered Old and Valuable Trees (OVT), and Stonewall Trees were found during the inspection.${deadN ? ' ' + deadN + ' dead trees with unknown species were observed in the survey area.' : ''}
Species composition of the survey area is summarized in the following table:`;
    const included = includedPhrase(indN, grpN, newN);
    const comprise = removedN
      ? (aliveN + ' alive trees, ' + deadN + ' dead trees and ' + removedN + ' removed trees. ')
      : (aliveN + ' alive trees and ' + deadN + ' dead trees. ');
    const totalLine = removedN
      ? (aliveN + ' (Alive) + ' + deadN + ' (Dead Trees) + ' + removedN + ' (Removed) = ' + active.length + '.')
      : (aliveN + ' (Alive) + ' + deadN + ' (Dead Trees) = ' + active.length + '.');
    const section4Body = `A tree survey has been carried out within the respective Project Area${projectPhrase}, to record the number of trees, species name, trunk diameters, height, crown spread, tree form, health condition.
Based on the site inspection conducted prior to the commencement of works, total of ${active.length} nos. of surveyed tree. ${included ? included + ' comprising ' + comprise : 'Comprising ' + comprise}No rare or protected species as listed under Cap.96 and Cap.586 were recorded.
Total Number of Trees Found On-Site:
${totalLine}`;
    const groupBlocks = [
      ...groups.map(g => {
        const list = active.filter(t => isTG(t.zone) && normTG(t.zone) === g);
        return { title: `${g} (${list.length} nos.)`, rows: speciesBreakdown(list), total: list.length };
      }),
      ...[['INDIVIDUAL', 'Individual trees in TPRP'], ['NEW', 'Newly found trees']].map(([kind, title]) => {
        const list = active.filter(t => classifyKind(t) === kind);
        return list.length ? { title: `${title} (${list.length} nos.)`, rows: speciesBreakdown(list), total: list.length } : null;
      }).filter(Boolean)
    ];
    const monthYear = new Date().toLocaleString('en',{month:'long',year:'numeric'});
    const otherPhrase = !otherGroups.length ? ''
      : otherGroups.length === 1 ? `, and ${otherGroups[0].n} for ${otherGroups[0].label}`
      : `, and ${others.length} for other mitigation measures (${otherGroups.map(g => g.label).join('; ')})`;
    const section5Intro = `A total of ${active.length} trees and ${speciesLive.length} species were recorded. The dominant species is ${domSci}${domRest ? ' ' + domRest : ''}.${deadN ? ' ' + deadN + ' dead trees with unknown species were observed in the survey area.' : ''}`;
    const section6Intro = `A total of ${prune.length} trees were recommended for pruning, ${removal.length} number were recommended for tree removal, ${monitor.length} for keep monitoring, ${pest.length} for pest control${otherPhrase}. (See Table 1). The proposed mitigations for specific trees are summarised in the table (See Table 2). For details, please refer to Section 7 – Appendix D (Tree inventory).`;
    const triageRows = [
      {colour: 'Black', n: blk.length, nos: joinNos(blk)},
      {colour: 'Red', n: reds.length, nos: joinNos(reds)},
      {colour: 'Orange', n: o.length, nos: joinNos(o)},
      {colour: 'Yellow', n: y.length, nos: joinNos(y)}
    ];
    const recSummary = [
      {label: 'Pruning (unique, no duplicate tree no.)', n: pruneIds.length, nos: joinNos(pruneIds)},
      {label: 'Tree removal', n: removalIds.length, nos: joinNos(removalIds)},
      {label: 'Re-inspection', n: reinspect.length, nos: joinNos(reinspect)},
      {label: 'Keep monitoring', n: monitorIds.length, nos: joinNos(monitorIds)},
      {label: 'Pest control / mistletoe', n: pestIds.length, nos: joinNos(pestIds)},
      ...otherGroups.map(g => ({label: g.label, n: g.n, nos: g.nos}))
    ];
    const recTable1 = [
      {label: 'Tree pruning', n: prune.length},
      {label: 'Tree removal', n: removal.length},
      {label: 'Keep monitoring', n: monitor.length},
      {label: 'Pest control / mistletoe', n: pest.length},
      ...otherGroups.map(g => ({label: g.label, n: g.n}))
    ];
    const recDetails = [
      {label: 'Tree pruning', nos: joinNos(pruneIds)},
      {label: 'Tree removal', nos: joinNos(removalIds)},
      {label: 'Re-inspection', nos: joinNos(reinspect)},
      {label: 'Keep monitoring', nos: joinNos(monitorIds)},
      {label: 'Pest control / mistletoe', nos: joinNos(pestIds)},
      ...otherGroups.map(g => ({label: g.label, nos: g.nos}))
    ];
    const formAView = formARows(formA);
    const formBView = formBGroups(formB);
    const reportData = { mode, project, monthYear, groupIntro, section33Intro, section4Body, section5Intro, section6Intro, species: speciesOrdered, total: active.length, groupBlocks, triageRows, recSummary, recTable1, recDetails, formA, formB, formAView, formBView };
    const tgSummaryHtml = groupBlocks.map(g =>
      `<h3>${esc(g.title)}</h3>` + (g.rows.length ? speciesTableHtml(g.rows, g.total) : '<p>No tree was found in this Tree Group.</p>')
    ).join('');
    const section4 = mode === 'construction' ? `
      <p class="noprint">
        <button type="button" id="btnWord">匯出 Word</button>
        <button type="button" id="btnExcel">匯出 Excel</button>
      </p>
      <div id="report">
      ${groupIntro ? `<p>${esc(groupIntro)}</p>` : ''}
      <h2>3.3 Species and OVT in approved TPRP</h2>
      <p>${section33Intro.replace(/\n/g, '</p><p>')}</p>
      ${speciesTableHtml(speciesOrdered, active.length)}
      <h2>SECTION 4<br>CONCLUSION</h2>
      <p>${section4Body.replace(/\n/g, '</p><p>')}</p>
      <h2>Tree Group Summary</h2>
      ${tgSummaryHtml}
      </div>
    ` : '';

    const speciesWarn = speciesRemarkDead.length ? `
      <div class="warn noprint">
        <h3>請核對：${speciesRemarkDead.length} 棵樹的 Tree species 不是 Dead tree，但 Remarks 寫了 Dead tree</h3>
        <table><tr><th>Tree No</th><th>Tree species</th><th>Remarks</th></tr>
        ${speciesRemarkDead.map(t => `<tr><td>${esc(t.no)}</td><td><span class="sci">${esc(t.sci)}</span> ${esc(t.chi)}</td><td>${esc(t.remarks)}</td></tr>`).join('')}
        </table>
        <p>報告會保留 Schedule 上的品種名稱，不會因為 Remarks 寫了 Dead tree 就自動改種；請在 Schedule 核對品種或備註。</p>
      </div>` : '';
    const nameWarn = (nameMismatches.sameSci.length || nameMismatches.similarChi.length) ? `
      <div class="warn noprint">
        <h3>請核對：同一樹種的學名或中文名不一致</h3>
        ${nameMismatches.sameSci.length ? `<p>同一學名但中文名不同</p>
        <table><tr><th>Scientific Name</th><th>Chinese Name</th><th>棵數</th><th>Tree No.</th></tr>
        ${nameMismatches.sameSci.map(g => g.variants.map(v => `<tr><td><span class="sci">${esc(v.sci)}</span></td><td>${esc(v.chi)}</td><td>${v.n}</td><td>${ids(v.nos)}</td></tr>`).join('')).join('')}
        </table>` : ''}
        ${nameMismatches.similarChi.length ? `<p>同一或相近中文名但學名不同${nameMismatches.similarChi.map(g => '（' + g.names.join('、') + '）').join('')}</p>
        <table><tr><th>Tree No.</th><th>Scientific Name</th><th>Chinese Name</th></tr>
        ${nameMismatches.similarChi.map(g => g.trees.map(t => `<tr><td>${esc(t.no)}</td><td><span class="sci">${esc(t.sci)}</span></td><td>${esc(t.chi)}</td></tr>`).join('')).join('')}
        </table>` : ''}
        <p>報告仍按 Schedule 的用字分開統計；請在 Schedule 統一名稱。</p>
      </div>` : '';
    const remarkNonstandard = remarkMismatches.filter(r => r.type !== 'exact').length;
    const remarkWarn = remarkMismatches.length ? `
      <div class="warn noprint">
        <h3>全部 Remarks（${remarkMismatches.length} 項用字${remarkNonstandard ? '，其中 ' + remarkNonstandard + ' 項不是標準 description' : ''}）</h3>
        <table><tr><th>Remarks 用字</th><th>棵數</th><th>Tree No.</th></tr>
        ${remarkMismatches.map(r => `<tr><td>${esc(r.item)}</td><td>${r.nos.length}</td><td>${ids(r.nos)}</td></tr>`).join('')}
        </table>
        <p>已列出 Schedule 內所有 Remarks 用字（N.A. 除外）；符合標準的項目一併列出。</p>
      </div>` : '';
    const officialWarn = officialChecks.length ? `
      <div class="warn noprint">
        <h3>請核對：${officialChecks.length} 項學名或中文名與官方清單不符</h3>
        <table><tr><th>Scientific Name</th><th>Chinese Name</th><th>棵數</th><th>Tree No.</th><th>核對結果</th></tr>
        ${officialChecks.map(r => `<tr><td><span class="sci">${esc(r.sci)}</span></td><td>${esc(r.chi)}</td><td>${r.n}</td><td>${ids(r.nos)}</td><td>${officialNameNoteHtml(r)}</td></tr>`).join('')}
        </table>
        <p>依據發展局綠化網「二維條碼樹木標籤」203 種市區常見樹木清單核對（Dead tree、Unidentified 除外）。清單以外的品種不會列為不符。報告仍按 Schedule 用字統計，不會自動改名。</p>
      </div>` : '';
    const writingWarn = writingChecks.length ? `
      <div class="warn noprint">
        <h3>請核對：${writingChecks.length} 項學名或中文名寫法（大小寫、符號或詳略差異）</h3>
        <table><tr><th>Scientific Name</th><th>Chinese Name</th><th>棵數</th><th>Tree No.</th><th>核對結果</th></tr>
        ${writingChecks.map(r => `<tr><td><span class="sci">${esc(r.sci)}</span></td><td>${esc(r.chi)}</td><td>${r.n}</td><td>${ids(r.nos)}</td><td>${writingNoteHtml(r)}</td></tr>`).join('')}
        </table>
        <p>學名正確大小寫為屬名首字大階、第2個字（種加詞）細階。報告仍按 Schedule 用字分開統計，不會自動改名。</p>
      </div>` : '';
    const protectedWarn = protectedChecks.length ? `
      <div class="warn noprint">
        <h3>請核對：${protectedChecks.length} 項品種列於第96章或第586章保護名單</h3>
        <table><tr><th>Scientific Name</th><th>Chinese Name</th><th>棵數</th><th>Tree No.</th><th>法例</th><th>名單記載</th></tr>
        ${protectedChecks.map(r => `<tr><td><span class="sci">${esc(r.sci)}</span></td><td>${esc(r.chi)}</td><td>${r.n}</td><td>${ids(r.nos)}</td><td>${esc(r.ordinances)}</td><td>${protectedNoteHtml(r)}</td></tr>`).join('')}
        </table>
        <p>此檢查比對《林務規例》（第96A章，屬第96章附屬法例）第2條所列植物，以及第586章下香港植物標本室所列原生植物，另包括常見於樹木調查的木本／蘇鐵類列明類群（沉香屬、黃檀屬、蘇鐵科、澤米鐵科等）。並非核對第586章附表1的全部動植物。名單以外的品種不會列出。報告仍按 Schedule 用字統計，不會自動改名。如需確定現行管制範圍，請再核對法例原文。</p>
      </div>` : '';
    const warnBox = speciesWarn + nameWarn + writingWarn + officialWarn + protectedWarn + remarkWarn;
    const privateBody = `
      <p class="noprint">
        <button type="button" id="btnWord">匯出 Word</button>
        <button type="button" id="btnExcel">匯出 Excel</button>
      </p>
      <div id="report">
      <h2>Section 5<br>Tree Survey Findings</h2>
      <p>A total of ${active.length} trees and ${speciesLive.length} species were recorded. The dominant species is <span class="sci">${esc(domSci)}</span> ${esc(domRest)}.${deadN ? ' ' + deadN + ' dead trees with unknown species were observed in the survey area.' : ''}</p>
      <table><tr><th>Tree Species</th><th>Quantity</th></tr>
      ${spRows.map(x => `<tr><td><span class="sci">${esc(x.sci)}</span> ${esc(x.chi)}</td><td>${esc(qtyLabel(x))}</td></tr>`).join('')}
      <tr><td>Total number of trees</td><td>${active.length}</td></tr></table>
      <p>TRIAGE colour summary</p>
      <table><tr><th>Colour</th><th>No. of trees</th><th>Tree No.</th></tr>
      ${[['Black',blk],['Red',reds],['Orange',o],['Yellow',y]].map(([c,a]) => `<tr><td>${c}</td><td>${a.length}</td><td>${ids(a)}</td></tr>`).join('')}
      </table>
      <h2>Section 6<br>Tree Risk Assessment Findings</h2>
      <p>${section6Intro}</p>
      <p>Summary of tree numbers by recommendation</p>
      <table><tr><th>Recommendation</th><th>No. of trees</th><th>Tree No.</th></tr>
      <tr><td>Pruning (unique, no duplicate tree no.)</td><td>${pruneIds.length}</td><td>${ids(pruneIds)}</td></tr>
      <tr><td>Tree removal</td><td>${removalIds.length}</td><td>${ids(removalIds)}</td></tr>
      <tr><td>Re-inspection</td><td>${reinspect.length}</td><td>${ids(reinspect)}</td></tr>
      <tr><td>Keep monitoring</td><td>${monitorIds.length}</td><td>${ids(monitorIds)}</td></tr>
      <tr><td>Pest control / mistletoe</td><td>${pestIds.length}</td><td>${ids(pestIds)}</td></tr>
      ${otherGroups.map(g => `<tr><td>${esc(g.label)}</td><td>${g.n}</td><td>${ids(g.trees)}</td></tr>`).join('')}
      </table>
      <p>Table 1. The summary of tree amounts with proposed mitigation measures</p>
      <table><tr><th>Recommendations</th><th>No. of trees</th></tr>
      <tr><td>Tree pruning</td><td>${prune.length}</td></tr>
      <tr><td>Tree removal</td><td>${removal.length}</td></tr>
      <tr><td>Keep monitoring</td><td>${monitor.length}</td></tr>
      <tr><td>Pest control / mistletoe</td><td>${pest.length}</td></tr>
      ${otherGroups.map(g => `<tr><td>${esc(g.label)}</td><td>${g.n}</td></tr>`).join('')}
      </table>
      <p>Table 2. Detailed mitigation measures</p>
      <p>Tree pruning:<br>${ids(pruneIds)}</p>
      <p>Tree removal:<br>${ids(removalIds)}</p>
      <p>Re-inspection:<br>${ids(reinspect)}</p>
      <p>Keep monitoring:<br>${ids(monitorIds)}</p>
      <p>Pest control / mistletoe:<br>${ids(pestIds)}</p>
      ${otherGroups.map(g => `<p>${esc(g.label)}:<br>${ids(g.trees)}</p>`).join('')}
      <h2>Form 1 - Table (A) Triage Trees & Trees Require Remedial Actions (${formA.length})</h2>
      <table><tr><th>Dept. Tree ID</th><th>Zone</th><th>Tree Species (Scientific + Chinese)</th><th>DBH (mm)</th><th>Est. Height (m)</th><th>Est. Crown Spread (m)</th><th>Tree Status</th><th>Overall Tree Conditions</th><th>Triage Colour</th><th>Remedial Action</th><th>Anticipated Completion Date</th></tr>
      ${formAView.map(t => `<tr><td>${esc(t.no)}</td><td>${esc(t.zone)}</td><td><span class="sci">${esc(t.sci)}</span>${esc(t.chi)}</td><td>${esc(t.dbh)}</td><td>${esc(t.ht)}</td><td>${esc(t.spread)}</td><td>${esc(t.status)}</td><td>${esc(t.condition)}</td><td>${esc(t.triage)}</td><td>${esc(t.rec)}</td><td>${esc(t.date)}</td></tr>`).join('')}
      <tr><td colspan="11">Sub-total No. of Trees in Table (A): ${formA.length}</td></tr>
      </table>
      <h2>Form 1 - Table (B) Other Trees (${formB.length})</h2>
      <table><tr><th>Tree Species 樹種</th><th>App. Quantity of Trees</th><th>Height From (m)</th><th>To (m)</th><th>Overall Conditions</th></tr>
      ${formBView.map(g => `<tr><td><span class="sci">${esc(g.sci)}</span>${esc(g.chi)}</td><td>${g.n}</td><td>${g.from}</td><td>${g.to}</td><td>${esc(g.condition)}</td></tr>`).join('')}
      <tr><td colspan="5">Sub-total No. of Trees in Table (B): ${formB.length}</td></tr>
      </table>
      <p class="note">品種摘要見 Section 5。有效總數 ${active.length}（已排除 Removed）。TPRP ${tprpN}／新發現 ${newN}。工作表：${esc(usedSheet)}</p>
      </div>
    `;
    document.getElementById('out').innerHTML = `
      ${warnBox}
      <h1>${mode === 'construction' ? 'Tree Survey Report' : 'Tree Risk Assessment Report'}</h1>
      <p style="text-align:center">${esc(project || 'Schedule to Form 1')}<br>${esc(monthYear)}</p>
      ${mode === 'construction' ? section4 : privateBody}
    `;
    const btnWord = document.getElementById('btnWord');
    const btnExcel = document.getElementById('btnExcel');
    if (btnWord) btnWord.onclick = () => exportWord(reportData);
    if (btnExcel) btnExcel.onclick = () => exportExcel(reportData);
  };
  reader.readAsArrayBuffer(file);
}
</script>
</body>
</html>
