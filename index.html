<body>
<div id="drop">把 Tree Assessment Schedule（.xlsx / .xls）拖到這裡，或點擊選擇檔案</div>
<input type="file" id="file" accept=".xlsx,.xls" hidden>
<div class="opts">
  <label>工程名稱 <input type="text" id="project" placeholder="可留空；會嘗試由表頭自動讀取"></label>
  <label>額外 Tree Groups（冇樹都要列入） <input type="text" id="extraGroups" placeholder="例如：TG769"></label>
  <label><input type="radio" name="dead" value="Unidentified" checked> Dead tree → Unidentified</label>
  <label><input type="radio" name="dead" value="Dead tree"> Dead tree → Dead tree</label>
  <label><input type="radio" name="mode" value="construction" checked> Construction（3.3 及 Section 4）</label>
  <label><input type="radio" name="mode" value="private"> Private（不出 Section 4）</label>
</div>
<p class="note">檔案只在你的瀏覽器處理，不會上載到伺服器。Remarks 會對照內建缺陷表；用字相近但不是標準 description 的項目會列出。</p>
<div id="out"></div>
<script>

const fileInput = document.getElementById('file');
let lastFile = null;
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) run(e.dataTransfer.files[0]); };
fileInput.onchange = () => { if (fileInput.files[0]) run(fileInput.files[0]); };
document.querySelectorAll('input[name=dead], input[name=mode]').forEach(el => {
  el.addEventListener('change', () => { if (lastFile) run(lastFile); });
});
['project','extraGroups'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { if (lastFile) run(lastFile); });
});

const s = v => String(v ?? '').replace(/[\u00a0\u200b\u200c\u200d\ufeff\u3000]/g, ' ').replace(/\s+/g, ' ').trim();
const esc = v => s(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const looks = v => {
  const t = s(v).replace(/\s+/g,'');
  if (!t || /^(nan|none|n\.?a\.?|-|item|sn|no|treeno|treenumber|treeid)$/i.test(t)) return false;
  if (/^\d{4}-\d{2}-\d{2}/.test(t)) return false;
  if (!/\d/.test(t) || t.length > 32) return false;
  return /^[A-Za-z0-9][A-Za-z0-9\-_.\/]*[A-Za-z0-9]$/.test(t) || /^\d+[A-Za-z]?$/.test(t);
};
const isRemoved = r => /^removed(\s|$|,|;|\/)/i.test(r) || (/\bremoved\b/i.test(r) && !/trunk|branch/i.test(r));
const isDeadSpecies = (sci, chi) => /dead\s*trees?|^dead$|unidentified|死樹|枯樹/i.test((s(sci) + ' ' + s(chi)).trim());
const remarkIsDeadTree = rem => {
  const t = s(rem);
  return /dead\s*trees?|死樹|枯樹/i.test(t) || /^dead\.?$/i.test(t);
};
const DEFECTS = [

const splitRemarks = rem => s(rem).split(/[,;，、]+/).map(x => x.replace(/\s+/g,' ').trim())
  .filter(x => x && !/^(n\.?a\.?|nan|nil|none|-)$/i.test(x));
const defectKey = t => s(t).replace(/\u00a0/g,' ').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
const compactKey = t => defectKey(t).replace(/[^a-z0-9\u4e00-\u9fff]+/g,'');
const stemWord = w => {
  const out = [w];
  if (w.length > 4 && w.endsWith('s') && !/(ss|us|is)$/.test(w)) out.push(w.slice(0, -1));
  if (w.length > 6 && w.endsWith('ing')) out.push(w.slice(0, -3));
  if (w.length > 5 && w.endsWith('ed')) out.push(w.slice(0, -2));
  return out;
};
const defectTokens = t => defectKey(t).replace(/[^a-z0-9\u4e00-\u9fff]+/g,' ').trim().split(/\s+/).filter(Boolean);
const STOP = new Set(['on','of','at','with','by','the','a','an','and','due','to','in']);
const DEFECT_EXACT = new Map(DEFECTS.map(d => [defectKey(d), d]));
function levRatio(a, b) {
  if (a === b) return 1;
  const m = a.length, n = b.length;
  if (!m || !n) return 0;
  const dp = Array.from({length: m + 1}, (_, i) => {
    const row = new Array(n + 1);
    row[0] = i;
    return row;
  });
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return 1 - dp[m][n] / Math.max(m, n);
}
function tokenScore(a, b) {
  const ta = defectTokens(a), tb = defectTokens(b);
  if (!ta.length || !tb.length) return 0;
  const expand = words => {
    const set = new Set();
    words.forEach(w => stemWord(w).forEach(x => set.add(x)));
    return set;
  };
  const sa = expand(ta), sb = expand(tb);
  let inter = 0;
  for (const x of sa) if (sb.has(x)) inter++;
  const union = sa.size + sb.size - inter;
  const jac = union ? inter / union : 0;
  const dice = (2 * inter) / (sa.size + sb.size);
  const sortA = [...ta].map(w => stemWord(w)[0]).sort().join(' ');
  const sortB = [...tb].map(w => stemWord(w)[0]).sort().join(' ');
  const sortR = sortA === sortB ? 1 : levRatio(sortA, sortB);
  const content = ta.filter(w => !STOP.has(w));
  let contain = 0;
  if (content.length && content.every(w => stemWord(w).some(x => sb.has(x)))) {
    contain = 0.72 + 0.2 * (content.length / Math.max(tb.length, 1));
  }
  return Math.max(jac, dice, sortR, contain);
}
function bestDefect(item) {
  const k = defectKey(item);
  if (DEFECT_EXACT.has(k)) return { type: 'exact', official: DEFECT_EXACT.get(k), score: 1 };
  let best = { official: '', score: 0 };
  const ck = compactKey(item);
  for (const d of DEFECTS) {
    const score = Math.max(tokenScore(item, d), levRatio(ck, compactKey(d)));
    if (score > best.score) best = { official: d, score };
  }
  if (best.score >= 0.62) return { type: 'similar', official: best.official, score: best.score };
  return { type: 'none', official: best.score >= 0.5 ? best.official : '', score: best.score };
}
function collectRemarkMismatches(trees) {
  const map = new Map();
  for (const t of trees) {
    for (const item of splitRemarks(t.remarks)) {
      const m = bestDefect(item);
      if (m.type === 'exact') continue;
      const key = item + '\0' + m.type + '\0' + m.official;
      if (!map.has(key)) map.set(key, { item, type: m.type, official: m.official, nos: [] });
      map.get(key).nos.push(t.no);
    }
  }
  const rank = typ => typ === 'similar' ? 0 : 1;
  return [...map.values()].sort((a, b) => rank(a.type) - rank(b.type) || b.nos.length - a.nos.length || a.item.localeCompare(b.item));
}
const ids = list => list.map(t => typeof t === 'string' ? esc(t) : esc(t.no)).join(', ') || '/';
const isTG = v => {
  const t = s(v).replace(/\s+/g,'');
  return /^(TG)?\d{3,5}$/i.test(t);
};
const normTG = v => {
  const t = s(v).replace(/\s+/g,'').replace(/^TG/i,'');
  return 'TG' + t;
};
const parseExtraGroups = v => s(v).split(/[,;，、\s]+/).map(x => x.trim()).filter(isTG).map(normTG);
const isBlankGroup = v => {
  const t = s(v);
  return !t || /^(n\.?a\.?|nan|-)$/i.test(t);
};
function classifySource(t) {
  if (isTG(t.zone)) return 'TPRP';
  if (isBlankGroup(t.zone)) return 'NEW';
  if (/tprp/i.test(t.source)) return 'TPRP';
  if (/\bnew\b|newly/i.test(t.source)) return 'NEW';
  return '';
}
function classifyKind(t) {
  if (isTG(t.zone)) return 'GROUP';
  if (/^(ind(ividual)?s?|it)$/i.test(s(t.zone))) return 'INDIVIDUAL';
  const srcNew = /\bnew\b|newly/i.test(t.source);
  const srcTprp = /tprp/i.test(t.source) && !srcNew;
  const no = s(t.no).replace(/\s+/g, '');
  const looksInd = /^(T-?)\d+/i.test(no) && !/^TG/i.test(no);
  if (srcTprp || (looksInd && !srcNew)) return 'INDIVIDUAL';
  return 'NEW';
}
function includedPhrase(indN, grpN, newN) {
  const parts = [];
  if (indN) parts.push(indN + ' nos. of trees recorded in the form of individual trees in TPRP');
  if (grpN) parts.push(grpN + ' nos. of trees recorded in the form of tree groups in TPRP');
  if (newN) parts.push(newN + ' nos. of trees newly found in the survey');
  if (!parts.length) return '';
  if (parts.length === 1) return 'The surveyed tree included ' + parts[0];
  if (parts.length === 2) return 'The surveyed tree included ' + parts[0] + ' and ' + parts[1];
  return 'The surveyed tree included ' + parts[0] + ', ' + parts[1] + ' and ' + parts[2];
}
function qtyLabel(x) {
  if (x.removed && x.removed === x.n) return x.n + ' (Removed)';
  if (x.removed) return x.n + ' (' + x.removed + ' Removed)';
  return String(x.n);
}
function speciesBreakdown(list) {
  const map = {};
  for (const t of list) {
    const k = t.sci + '|' + t.chi;
    if (!map[k]) map[k] = { sci: t.sci, chi: t.chi, n: 0, removed: 0, nos: [] };
    map[k].n++;
    if (isRemoved(t.remarks)) map[k].removed++;
    map[k].nos.push(t.no);
  }
  const rows = Object.values(map);
  const live = rows.filter(x => !isDeadSpecies(x.sci, x.chi))
    .sort((a, b) => a.sci.toLowerCase().localeCompare(b.sci.toLowerCase()));
  const dead = rows.filter(x => isDeadSpecies(x.sci, x.chi));
  return [...live, ...dead];
}
function isItalicSci(sci, chi) {
  return !isDeadSpecies(sci, chi);
}
function sciHtml(sci, chi) {
  const t = esc(sci);
  return isItalicSci(sci, chi) ? `<i>${t}</i>` : t;
}
function speciesTableHtml(rows, total) {
  return `<table>
      <tr><th></th><th>Scientific Name</th><th>Chinese Name</th><th>Quantity</th></tr>
      ${rows.map((x, i) => `<tr><td>${i + 1}</td><td>${sciHtml(x.sci, x.chi)}</td><td>${esc(x.chi)}</td><td>${esc(qtyLabel(x))}</td></tr>`).join('')}
      <tr><td>Total</td><td></td><td></td><td>${total}</td></tr></table>`;
}
function xmlEsc(v) {
  return String(v ?? '').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}
function strToU8(s) { return new TextEncoder().encode(s); }
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {
  const chunks = [], central = [];
  let offset = 0;
  for (const {name, data} of files) {
    const n = strToU8(name);
    const d = typeof data === 'string' ? strToU8(data) : data;
    const crc = crc32(d);
    const loc = new Uint8Array(30 + n.length);
    const v = new DataView(loc.buffer);
    v.setUint32(0, 0x04034b50, true);
    v.setUint16(4, 20, true);
    v.setUint16(6, 0x0800, true);
    v.setUint32(14, crc, true);
    v.setUint32(18, d.length, true);
    v.setUint32(22, d.length, true);
    v.setUint16(26, n.length, true);
    loc.set(n, 30);
    chunks.push(loc, d);
    const cen = new Uint8Array(46 + n.length);
    const cv = new DataView(cen.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, d.length, true);
    cv.setUint32(24, d.length, true);
    cv.setUint16(28, n.length, true);
    cv.setUint32(42, offset, true);
    cen.set(n, 46);
    central.push(cen);
    offset += loc.length + d.length;
  }
  let cenSize = 0;
  central.forEach(c => { cenSize += c.length; });
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cenSize, true);
  ev.setUint32(16, offset, true);
  const parts = [...chunks, ...central, eocd];
  let total = 0;
  parts.forEach(p => { total += p.length; });
  const out = new Uint8Array(total);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function downloadBytes(bytes, filename, mime) {
  const blob = new Blob([bytes], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function exportBasename(project) {
  const base = s(project || 'Tree_Survey_Report').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
  return (base || 'Tree_Survey_Report').slice(0, 80);
}

function wRun(text, opts) {
  const p = [];
  if (opts && (opts.i || opts.b)) {
    p.push('<w:rPr>');
    if (opts.b) p.push('<w:b/><w:bCs/>');
    if (opts.i) p.push('<w:i/><w:iCs/>');
    p.push('</w:rPr>');
  }
  return `<w:r>${p.join('')}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r>`;
}
function wP(inner, style) {
  return `<w:p>${style ? `<w:pPr><w:pStyle w:val="${style}"/></w:pPr>` : ''}${inner || ''}</w:p>`;
}
function wTextP(text, style, opts) {
  return String(text).split('\n').map(line => wP(wRun(line, opts), style)).join('');
}
function wCell(inner, width) {
  return `<w:tc><w:tcPr><w:tcW w:w="${width}" w:type="dxa"/></w:tcPr>${inner || wP('')}</w:tc>`;
}
function wTable(rows, total) {
  const widths = [800, 3600, 2800, 1200];
  const b = n => `<w:${n} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`;
  const borders = `<w:tblBorders>${b('top')}${b('left')}${b('bottom')}${b('right')}${b('insideH')}${b('insideV')}</w:tblBorders>`;
  const grid = `<w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`;
  const cell = (i, inner) => wCell(wP(inner), widths[i]);
  const header = ['', 'Scientific Name', 'Chinese Name', 'Quantity'];
  const headerRow = `<w:tr>${header.map((h, i) => cell(i, wRun(h, {b:true}))).join('')}</w:tr>`;
  const body = rows.map((x, i) => `<w:tr>${
    cell(0, wRun(String(i + 1))) +
    cell(1, wRun(x.sci, {i: isItalicSci(x.sci, x.chi)})) +
    cell(2, wRun(x.chi)) +
    cell(3, wRun(qtyLabel(x)))
  }</w:tr>`).join('');
  const totalRow = `<w:tr>${

function colLetter(n) {
  let s = '';
  n += 1;
  while (n) { n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
  return s;
}
function xCell(r, c, value, style, type) {
  const ref = colLetter(c) + r;
  if (type === 'n') return `<c r="${ref}" s="${style}" t="n"><v>${value}</v></c>`;
  if (value === '' || value == null) return `<c r="${ref}" s="${style}"/>`;
  return `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(value)}</t></is></c>`;
}
function xSheet(name, rows, cols) {
  const maxR = rows.length;
  const maxC = cols || 4;
  const dim = `A1:${colLetter(maxC - 1)}${Math.max(maxR, 1)}`;
  const sheetData = rows.map((row, i) => {
    const r = i + 1;
    const cells = row.map((cell, c) => {
      if (!cell) return xCell(r, c, '', 4);
      return xCell(r, c, cell.v, cell.s, cell.t);
    }).join('');
    return `<row r="${r}">${cells}</row>`;
  }).join('');
  return {name, xml: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <dimension ref="${dim}"/>
  <sheetViews><sheetView workbookViewId="0"/></sheetViews>
  <sheetFormatPr defaultRowHeight="15"/>
  <cols>
    <col min="1" max="1" width="8" customWidth="1"/>
    <col min="2" max="2" width="42" customWidth="1"/>
    <col min="3" max="3" width="28" customWidth="1"/>
    <col min="4" max="4" width="14" customWidth="1"/>
  </cols>
  <sheetData>${sheetData}</sheetData>
</worksheet>`};
}
function xTableRows(startTitle, rows, total) {

    {v: '', s: 6, t: 's'},
    {v: '', s: 6, t: 's'},
    {v: total, s: 6, t: 'n'}
  ]);
  return out;
}

function detectProject(raw, hr) {
  const skip = /tree assessment schedule|initial tree survey|tree inventory|^nan$/i;
  let best = '';
  for (let i = 0; i < hr; i++) {
    for (const cell of (raw[i] || [])) {
      const t = s(cell).replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (t.length > best.length && t.length > 20 && !skip.test(t)) best = t;
    }
  }
  return best;
}

function findHeader(raw) {
  for (let i = 0; i < Math.min(raw.length, 25); i++) {
    const j = raw[i].map(x => String(x).toLowerCase().replace(/\n/g,' ')).join(' ');
    const first = s(raw[i][0]).toLowerCase();
    const hasId = j.includes('tree no') || j.includes('tree id') || j.includes('tree number') || j.includes('樹木編號') || j.includes('樹編號');
    const hasSp = j.includes('scientific') || j.includes('species') || j.includes('樹種') || j.includes('dbh') || j.includes('zone');
    if (hasId && hasSp && !j.includes('removed trees')) return i;
    if (first === 'trmz' && j.includes('zone') && hasId) return i;
  }
  return -1;
}

function run(file) {
  lastFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: 'array' });
    let raw = null, hr = 0, usedSheet = wb.SheetNames[0];
    for (const name of wb.SheetNames) {
      const tmp = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' });
      const found = findHeader(tmp);
      if (found >= 0) { raw = tmp; hr = found; usedSheet = name; break; }
    }
    if (!raw) {
      raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      hr = 0;
    }
    const hPrev = hr > 0 ? raw[hr-1].map(x => s(x).toLowerCase().replace(/\n/g,' ')) : [];
    const h1 = raw[hr].map(x => s(x).toLowerCase().replace(/\n/g,' '));
    const h2 = raw[hr+1] ? raw[hr+1].map(x => s(x).toLowerCase().replace(/\n/g,' ')) : [];
    const nCols = Math.max(hPrev.length, h1.length, h2.length);
    const combined = [];
    for (let i = 0; i < nCols; i++) {
      combined.push([hPrev[i]||'', h1[i]||'', h2[i]||''].filter(Boolean).join(' ').trim());
    }
    const find = (...kws) => combined.findIndex(t => kws.some(k => t.includes(k)));
    const findSkip = (kws, skips) => {
      const i = combined.findIndex(t => kws.some(k => t.includes(k)) && !skips.some(x => t.includes(x)));
      return i >= 0 ? i : find(...kws);
    };
    const c = {
      no: find('tree no','tree id','tree number','樹木編號','樹編號'),
      sci: find('scientific'),
      chi: find('chinese'),
      dbh: find('dbh'),
      ht: find('height'),
      sp: find('spread','crown'),
      health: find('health'),
      struct: find('structural'),
      triage: find('triage'),
      rem: findSkip(['remark'], ['remarks*', 'suitability']),
      rec: find('mitigation','recommend','proposed'),
      zone: find('tree group') >= 0 ? find('tree group') : find('zone'),
      source: find('tprp/new','tprp','newly found','new found'),
    };
    const dataStart = h2.some(v => /scientific|chinese|dbh/.test(v)) ? hr+2 : hr+1;
    const deadAs = document.querySelector('input[name=dead]:checked').value;
    if (c.source < 0 || raw.slice(dataStart, dataStart+30).filter(r => /tprp|\bnew\b/i.test(s(r[c.source]))).length < 3) {
      for (let col = 0; col < nCols; col++) {
        const hits = raw.slice(dataStart, dataStart+40).filter(r => /^(tprp|new)$/i.test(s(r[col]))).length;
        if (hits >= 5) { c.source = col; break; }
      }
    }
    const trees = [];
    const speciesRemarkDead = [];
    const mode = document.querySelector('input[name=mode]:checked').value;
    for (let i = dataStart; i < raw.length; i++) {
      const r = raw[i] || [];
      const no = s(r[c.no]).replace(/\s+/g,'');
      if (!looks(no)) continue;
      let sci = s(r[c.sci]), chi = s(r[c.chi]), remarks = s(r[c.rem]), rec = s(r[c.rec]);
      if (remarkIsDeadTree(remarks) && !isDeadSpecies(sci, chi)) {
        speciesRemarkDead.push({ no, sci, chi, remarks });
      }
      if (deadAs === 'Unidentified' && /dead tree|^dead$/i.test(remarks + ' ' + sci)) { sci = 'Unidentified'; chi = 'Unidentified'; }
      else if (/dead tree|^dead$/i.test(remarks + ' ' + sci)) { sci = 'Dead tree'; chi = '死樹'; }
      trees.push({ no, sci, chi, dbh: s(r[c.dbh]), ht: s(r[c.ht]), spread: s(r[c.sp]),
        health: s(r[c.health]), struct: s(r[c.struct]), triage: s(r[c.triage]),
        remarks, rec, zone: s(r[c.zone]), source: s(r[c.source]) });
    }
    const remarkMismatches = collectRemarkMismatches(trees);
    const dropped = /duplicate|not in use|out of lot|outside|boundary/i;
    const active = trees.filter(t => !dropped.test(t.remarks + ' ' + t.rec));
    const species = {};
    active.forEach(t => {
      const k = t.sci + '|' + t.chi;
      if (!species[k]) species[k] = { n: 0, removed: 0 };
      species[k].n++;
      if (isRemoved(t.remarks)) species[k].removed++;
    });
    const spRows = Object.entries(species).map(([k,v]) => { const [sci,chi]=k.split('|'); return {sci,chi,n:v.n,removed:v.removed}; })
      .sort((a,b) => a.sci.toLowerCase().localeCompare(b.sci.toLowerCase()));
    const dom = Object.entries(species).sort((a,b)=>b[1].n-a[1].n)[0];
    const domSci = dom ? dom[0].split('|')[0] : 'N.A.';
    const domRest = dom ? `${dom[0].split('|')[1]} (${dom[1].n})`.trim() : '';
    const PRUNE = /crown cleaning|crown reduction|crown raising|crown thinning|pruning|selective|defective branch|dead (trunk|branch)|co-dominant|epicormic/i;
    const REM = /tree removal|\bfell(ing)?\b/i;
    const prune = active.filter(t => PRUNE.test(t.rec));
    const removal = active.filter(t => REM.test(t.rec));
    const monitor = active.filter(t => /keep monitoring|monitoring/i.test(t.rec));
    const pest = active.filter(t => /pest control|mistletoe/i.test(t.rec));
    const others = active.filter(t => t.rec && !/^(n\.?a\.?|-|)$/i.test(t.rec) && !PRUNE.test(t.rec) && !REM.test(t.rec) && !/keep monitoring|monitoring|pest control|mistletoe/i.test(t.rec));
    const pruneIds = [...new Set(prune.map(t => t.no))];
    const monitorIds = monitor.map(t => t.no);
    const pestIds = pest.map(t => t.no);
    const removalIds = removal.map(t => t.no);
    const reinspect = active.filter(t => /re-inspection/i.test(t.rec)).map(t => t.no);
    const triage = col => active.filter(t => new RegExp('^'+col+'$','i').test(t.triage));
    const y = triage('Yellow'), o = triage('Orange'), reds = triage('Red'), blk = triage('Black');
    const formA = active.filter(t => /yellow|orange|red|black/i.test(t.triage) || (t.rec && !/^(n\.?a\.?|-|no mitigation)/i.test(t.rec)));
    const formB = active.filter(t => !formA.includes(t));

    const allGroupSet = new Set();
    for (let i = dataStart; i < raw.length; i++) {
      const z = raw[i][c.zone];
      if (isTG(z)) allGroupSet.add(normTG(z));
    }
    parseExtraGroups(document.getElementById('extraGroups').value).forEach(g => allGroupSet.add(g));
    const byNum = (a,b) => (parseInt(a.replace(/\D/g,''))||0) - (parseInt(b.replace(/\D/g,''))||0);
    const groups = [...allGroupSet].sort(byNum);
    const groupsWithTrees = [...new Set(active.map(t => isTG(t.zone) ? normTG(t.zone) : '').filter(Boolean))].sort(byNum);
    const tprpN = active.filter(t => classifySource(t) === 'TPRP').length;
    const newN = active.filter(t => classifyKind(t) === 'NEW').length;
    const indN = active.filter(t => classifyKind(t) === 'INDIVIDUAL').length;
    const grpN = active.filter(t => classifyKind(t) === 'GROUP').length;
    const removedN = active.filter(t => isRemoved(t.remarks)).length;
    const deadN = active.filter(t => isDeadSpecies(t.sci, t.chi) && !isRemoved(t.remarks)).length;
    const aliveN = active.length - deadN - removedN;
    const speciesLive = spRows.filter(x => !isDeadSpecies(x.sci, x.chi));
    const speciesOrdered = speciesBreakdown(active);
    const joinAnd = arr => arr.length > 1 ? arr.slice(0,-1).join(', ') + ', and ' + arr[arr.length-1] : (arr[0] || 'the site');
    const groupList = joinAnd(groups);
    const withList = joinAnd(groupsWithTrees.length ? groupsWithTrees : groups);
    const project = s(document.getElementById('project').value) || detectProject(raw, hr);
    const projectPhrase = project ? ' at ' + project : '';
    const section33Intro = `A total of ${speciesLive.length} species were recorded during the survey and are represented throughout the survey area. No rare tree species, Registered Old and Valuable Trees (OVT), and Stonewall Trees were found during the inspection.${deadN ? ' ' + deadN + ' dead trees with unknown species were observed in the survey area.' : ''}
Species composition of the survey area is summarized in the following table:`;
    const included = includedPhrase(indN, grpN, newN);
    const comprise = removedN
      ? (aliveN + ' alive trees, ' + deadN + ' dead trees and ' + removedN + ' removed trees. ')
      : (aliveN + ' alive trees and ' + deadN + ' dead trees. ');
    const totalLine = removedN
      ? (aliveN + ' (Alive) + ' + deadN + ' (Dead Trees) + ' + removedN + ' (Removed) = ' + active.length + '.')
      : (aliveN + ' (Alive) + ' + deadN + ' (Dead Trees) = ' + active.length + '.');
    const section4Body = `A tree survey has been carried out within the respective Project Area${projectPhrase}, to record the number of trees, species name, trunk diameters, height, crown spread, tree form, health condition.
Based on the site inspection conducted prior to the commencement of works, total of ${active.length} nos. of surveyed tree. ${included ? included + ' comprising ' + comprise : 'Comprising ' + comprise}No rare or protected species as listed under Cap.96 and Cap.586 were recorded.
Total Number of Trees Found On-Site:
${totalLine}`;
    const groupBlocks = [
      ...groups.map(g => {
        const list = active.filter(t => isTG(t.zone) && normTG(t.zone) === g);
        return { title: `${g} (${list.length} nos.)`, rows: speciesBreakdown(list), total: list.length };
      }),
      ...[['INDIVIDUAL', 'Individual trees in TPRP'], ['NEW', 'Newly found trees']].map(([kind, title]) => {
        const list = active.filter(t => classifyKind(t) === kind);
        return list.length ? { title: `${title} (${list.length} nos.)`, rows: speciesBreakdown(list), total: list.length } : null;
      }).filter(Boolean)
    ];
    const reportData = { project, section33Intro, section4Body, species: speciesOrdered, total: active.length, groupBlocks };
    const tgSummaryHtml = groupBlocks.map(g =>
      `<h3>${esc(g.title)}</h3>` + (g.rows.length ? speciesTableHtml(g.rows, g.total) : '<p>No tree was found in this Tree Group.</p>')
    ).join('');
    const section4 = mode === 'construction' ? `
      <p class="noprint">
        <button type="button" id="btnWord">匯出 Word</button>
        <button type="button" id="btnExcel">匯出 Excel</button>
      </p>
      <div id="report">
      <h2>3.3 Species and OVT in approved TPRP</h2>
      <p>${section33Intro.replace(/\n/g, '</p><p>')}</p>
      ${speciesTableHtml(speciesOrdered, active.length)}
      <h2>SECTION 4<br>CONCLUSION</h2>
      <p>${section4Body.replace(/\n/g, '</p><p>')}</p>
      <h2>Tree Group Summary</h2>
      ${tgSummaryHtml}
      </div>
    ` : '';

    const monthYear = new Date().toLocaleString('en',{month:'long',year:'numeric'});
    const speciesWarn = speciesRemarkDead.length ? `
      <div class="warn noprint">
        <h3>請核對：${speciesRemarkDead.length} 棵樹的 Tree species 不是 Dead tree，但 Remarks 寫了 Dead tree</h3>
        <table><tr><th>Tree No</th><th>Tree species</th><th>Remarks</th></tr>
        ${speciesRemarkDead.map(t => `<tr><td>${esc(t.no)}</td><td><span class="sci">${esc(t.sci)}</span> ${esc(t.chi)}</td><td>${esc(t.remarks)}</td></tr>`).join('')}
        </table>
        <p>報告仍會按 Dead tree 處理這些樹；請在 Schedule 更正品種或備註。</p>
      </div>` : '';
    const remarkWarn = remarkMismatches.length ? `
      <div class="warn noprint">
        <h3>請核對：${remarkMismatches.length} 項 Remarks 類似但不是缺陷表的標準 description</h3>
        <table><tr><th>Remarks 用字</th><th>棵數</th><th>Tree No.</th><th>最接近的表內 description</th></tr>
        ${remarkMismatches.map(r => `<tr><td>${esc(r.item)}</td><td>${r.nos.length}</td><td>${ids(r.nos)}</td><td>${r.official ? esc(r.official) : '（表內沒有相近項）'}${r.type === 'none' && r.official ? '（僅供參考）' : ''}</td></tr>`).join('')}
        </table>
        <p>完全符合表內用字的項目不會列出。請把相近用字改成標準 description，或確認該項是否應加入缺陷表。</p>
      </div>` : '';
    const warnBox = speciesWarn + remarkWarn;
    const privateBody = `
      <h2>Section 5<br>Tree Survey Findings</h2>
      <p>A total of ${active.length} trees and ${spRows.length} species were recorded. The dominant species is <span class="sci">${esc(domSci)}</span> ${esc(domRest)}.</p>
      <table><tr><th>Tree Species</th><th>Quantity</th></tr>
      ${spRows.map(x => `<tr><td><span class="sci">${esc(x.sci)}</span> ${esc(x.chi)}</td><td>${esc(qtyLabel(x))}</td></tr>`).join('')}
      <tr><td>Total number of trees</td><td>${active.length}</td></tr></table>
      <p>TRIAGE colour summary</p>
      <table><tr><th>Colour</th><th>No. of trees</th><th>Tree No.</th></tr>
      ${[['Black',blk],['Red',reds],['Orange',o],['Yellow',y]].map(([c,a]) => `<tr><td>${c}</td><td>${a.length}</td><td>${ids(a)}</td></tr>`).join('')}
      </table>
      <h2>Section 6<br>Tree Risk Assessment Findings</h2>
      <p>A total of ${prune.length} trees were recommended for pruning, ${removal.length} number were recommended for tree removal, ${monitor.length} for keep monitoring, ${pest.length} for pest control, and ${others.length} for other mitigation measures. (See Table 1). The proposed mitigations for specific trees are summarised in the table (See Table 2). For details, please refer to Section 7 – Appendix D (Tree inventory).</p>
      <p>Summary of tree numbers by recommendation</p>
      <table><tr><th>Recommendation</th><th>No. of trees</th><th>Tree No.</th></tr>
      <tr><td>Pruning (unique, no duplicate tree no.)</td><td>${pruneIds.length}</td><td>${ids(pruneIds)}</td></tr>
      <tr><td>Tree removal</td><td>${removalIds.length}</td><td>${ids(removalIds)}</td></tr>
      <tr><td>Re-inspection</td><td>${reinspect.length}</td><td>${ids(reinspect)}</td></tr>
      <tr><td>Keep monitoring</td><td>${monitorIds.length}</td><td>${ids(monitorIds)}</td></tr>
      <tr><td>Pest control / mistletoe</td><td>${pestIds.length}</td><td>${ids(pestIds)}</td></tr>
      </table>
      <p>Table 1. The summary of tree amounts with proposed mitigation measures</p>
      <table><tr><th>Recommendations</th><th>No. of trees</th></tr>
      <tr><td>Tree pruning</td><td>${prune.length}</td></tr>
      <tr><td>Tree removal</td><td>${removal.length}</td></tr>
      <tr><td>Keep monitoring</td><td>${monitor.length}</td></tr>
      <tr><td>Pest control / mistletoe</td><td>${pest.length}</td></tr>
      <tr><td>Other mitigation measures</td><td>${others.length}</td></tr>
      </table>
      <p>Table 2. Detailed mitigation measures</p>
      <p>Tree pruning:<br>${ids(pruneIds)}</p>
      <p>Tree removal:<br>${ids(removalIds)}</p>
      <p>Re-inspection:<br>${ids(reinspect)}</p>
      <p>Keep monitoring:<br>${ids(monitorIds)}</p>
      <p>Pest control / mistletoe:<br>${ids(pestIds)}</p>
      <p>Other mitigation measures:<br>${ids(others)}</p>
      <h2>Form 1 Table (A) — Triage / Remedial (${formA.length})</h2>
      <table><tr><th>Tree No</th><th>Species</th><th>DBH</th><th>Height</th><th>Triage</th><th>Remedial</th></tr>
      ${formA.map(t => `<tr><td>${esc(t.no)}</td><td><span class="sci">${esc(t.sci)}</span> ${esc(t.chi)}${isRemoved(t.remarks) ? ' (Removed)' : ''}</td><td>${esc(t.dbh)}</td><td>${esc(t.ht)}</td><td>${esc(t.triage)}</td><td>${esc(t.rec)}</td></tr>`).join('')}
      </table>
      <h2>Form 1 Table (B) — Other trees (${formB.length})</h2>
      <p class="note">品種摘要見 Section 5。有效總數 ${active.length}${removedN ? '（' + removedN + ' 棵已標示 Removed）' : ''}。TPRP ${tprpN}／新發現 ${newN}。工作表：${esc(usedSheet)}</p>
    `;
    document.getElementById('out').innerHTML = `
      ${warnBox}
      <h1>${mode === 'construction' ? 'Tree Survey Report' : 'Tree Risk Assessment Report'}</h1>
      <p style="text-align:center">${esc(project || 'Schedule to Form 1')}<br>${esc(monthYear)}</p>
      ${mode === 'construction' ? section4 : privateBody}
    `;
    const btnWord = document.getElementById('btnWord');
    const btnExcel = document.getElementById('btnExcel');
    if (btnWord) btnWord.onclick = () => exportWord(reportData);
    if (btnExcel) btnExcel.onclick = () => exportExcel(reportData);
  };
  reader.readAsArrayBuffer(file);
}
</script>
</body>
</html>
